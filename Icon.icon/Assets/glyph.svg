<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Foreground glyph for Icon Composer.

    Canvas is the standard 1024x1024 icon grid. Icon Composer draws the tile,
    material and shadow, so this layer is transparent and contains only the mark.

    The 824x824 tile occupies 100..924; the glyph is centred in it at ~62% of
    the tile width, which is the usual weight for a simple symbol.
  -->
  <g fill="#1D1D1F">
    <!-- heading bar -->
    <rect x="256" y="384" width="347" height="50" rx="16"/>
    <!-- body lines, ragged right -->
    <rect x="256" y="476" width="511" height="21" rx="10.5"/>
    <rect x="256" y="524" width="511" height="21" rx="10.5"/>
    <rect x="256" y="572" width="455" height="21" rx="10.5"/>
    <rect x="256" y="620" width="317" height="21" rx="10.5"/>
  </g>
</svg>
